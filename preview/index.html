        const routeScenario = ROUTE_SCENARIOS[routeScenarioId] || ROUTE_SCENARIOS.CURRENT_STANDARD;
        const evalProfile = EVALUATION_PROFILES[evalProfileId] || EVALUATION_PROFILES.PROF_STAFF_CHIEF;

        const appCount = routeScenario.appraiserCount;

        const nowDate = document.getElementById('lab-now-date').value;
        const activeSlot = Math.min(parseInt(document.getElementById('lab-slot').value, 10), appCount);

        mockRecord.Status.value = st;
        mockRecord.Routing_Topology.value = routeScenario.topology || topVal;

        mockRecord.PartA_Weight.value = String(evalProfile.partAWeight);
        mockRecord.PartB_Weight.value = String(evalProfile.partBWeight);
        mockRecord.Competency_Set_Code.value = evalProfile.compSetCode;

        const phaseCalendar = {
          objectives: { start: document.getElementById('lab-cal-obj-start').value, end: document.getElementById('lab-cal-obj-end').value, label: `${document.getElementById('lab-cal-obj-start').value} to ${document.getElementById('lab-cal-obj-end').value}` },
          midyear: { start: document.getElementById('lab-cal-mid-start').value, end: document.getElementById('lab-cal-mid-end').value, label: `${document.getElementById('lab-cal-mid-start').value} to ${document.getElementById('lab-cal-mid-end').value}` },
          selfEvaluation: { start: document.getElementById('lab-cal-self-start').value, end: document.getElementById('lab-cal-self-end').value, label: `${document.getElementById('lab-cal-self-start').value} to ${document.getElementById('lab-cal-self-end').value}` },
          appraiserEvaluation: { start: document.getElementById('lab-cal-app-start').value, end: document.getElementById('lab-cal-app-end').value, label: `${document.getElementById('lab-cal-app-start').value} to ${document.getElementById('lab-cal-app-end').value}` },
          hrFinal: { start: document.getElementById('lab-cal-hr-start').value, end: document.getElementById('lab-cal-hr-end').value, label: `${document.getElementById('lab-cal-hr-start').value} to ${document.getElementById('lab-cal-hr-end').value}` }
        };

        const previewOptions = {
          isPreviewMode: true,
          previewNow: nowDate,
          activeSlotIndex: activeSlot,
          viewerRole: document.getElementById('lab-viewer-role')?.value || 'auto',
          phaseCalendar,
          routeScenario,
          evalProfile,
          competencySetCode: mockRecord.Competency_Set_Code.value,
          partAWeight: mockRecord.PartA_Weight.value,
          partBWeight: mockRecord.PartB_Weight.value,
          slot3CommentsA: { 1: 'Appraiser 3 Feedback: Excellent technical leadership.', 2: 'Appraiser 3: Good IT service SLA.', 3: 'Appraiser 3: Training completed.' },
          slot3CommentsB: { 1: 'Appraiser 3 Competency: Outstanding teamwork.', 2: 'Appraiser 3: Solves problems.' },
          slot4CommentsA: { 1: 'Appraiser 4 Feedback: Recommended for distinction.', 2: 'Appraiser 4: High SLA performance.', 3: 'Appraiser 4: Effective mentor.' },
          slot4CommentsB: { 1: 'Appraiser 4 Competency: High integrity.', 2: 'Appraiser 4: Sound decisions.' },
          slot3RatingsA: { 1: '4', 2: '4', 3: '5' },
          slot3RatingsB: { 1: '4', 2: '4', 3: '5', 4: '4', 5: '5', 6: '5', 7: '4', 8: '5' },
          slot4RatingsA: { 1: '5', 2: '4', 3: '5' },
          slot4RatingsB: { 1: '5', 2: '4', 3: '5', 4: '5', 5: '5', 6: '5', 7: '5', 8: '5' }
        };

        if (compMode === 'incomplete') {
          mockRecord.Manager_Achievement_1.value = '';
          mockRecord.Manager_Achievement_2.value = '';
          mockRecord.Manager_Achievement_3.value = '';
          mockRecord.GM_Achievement_1.value = '';
          mockRecord.GM_Achievement_2.value = '';
          mockRecord.GM_Achievement_3.value = '';
          delete previewOptions.slot3RatingsA;
          delete previewOptions.slot4RatingsA;
        } else {
          mockRecord.Manager_Achievement_1.value = '4';
          mockRecord.Manager_Achievement_2.value = '4';
          mockRecord.Manager_Achievement_3.value = '5';
          mockRecord.GM_Achievement_1.value = '4';
          mockRecord.GM_Achievement_2.value = '4';
          mockRecord.GM_Achievement_3.value = '5';
        }

        mount.innerHTML = '';
        const ui = new EmployeePartAUI({
          container: mount,
          record: mockRecord,
          stage: 'READ_ONLY',
          isEditable: true,
          appraiserCount: appCount,
          activeSlotIndex: activeSlot,
          isPreviewMode: true,
          previewOptions: previewOptions
        });
        ui.render();
      }

      ['lab-status', 'lab-route-scenario', 'lab-eval-profile', 'lab-completion', 'lab-slot', 'lab-topology', 'lab-now-date', 'lab-viewer-role',
       'lab-cal-obj-start', 'lab-cal-obj-end', 'lab-cal-mid-start', 'lab-cal-mid-end',
       'lab-cal-self-start', 'lab-cal-self-end', 'lab-cal-app-start', 'lab-cal-app-end',
       'lab-cal-hr-start', 'lab-cal-hr-end'
      ].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', updateLab);
      });

      updateLab();
    })();
  </script>
</body>
</html>
